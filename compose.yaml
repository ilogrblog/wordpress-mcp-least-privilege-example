# Local test bed for the least-privilege abilities example.
# WordPress on PHP (Apache), MariaDB 11.4 and a WP-CLI container that shares the
# WordPress files. Nothing here is suitable for production: the passwords are local
# test values, and the site runs in the "local" environment so that application
# passwords work over plain HTTP.
#
# Versions can be chosen when running bin/setup.sh:
#   WP_VERSION (default 7.1.3), PHP_VERSION (default 8.3), WP_PORT (default 8089).
name: mcp-least-privilege

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:${WP_VERSION:-7.1.3}-php${PHP_VERSION:-8.3}-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8089}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Application passwords over plain HTTP are only offered on a
      # "local" environment. Never set this on a real site.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp:/var/www/html
      - ./plugin/ilogr-draft-abilities:/var/www/html/wp-content/plugins/ilogr-draft-abilities:ro

  cli:
    image: wordpress:cli-php${PHP_VERSION:-8.3}
    depends_on:
      - wordpress
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp:/var/www/html
      - ./plugin/ilogr-draft-abilities:/var/www/html/wp-content/plugins/ilogr-draft-abilities:ro
      - ./vendor-plugins:/vendor-plugins:ro
    command: ["sleep", "infinity"]

volumes:
  db:
  wp:
